/* =============================================================
   Veridium home page layout (layout.conf)

   Written like CSS. Blocks render top to bottom, in the order
   they appear here. Properties cascade:
     * { ... }  - defaults for every block (blocks override)

   rl = row length: how many posters fit in a row on the viewer's
   screen. It is auto-detected per visitor (7 on a wide desktop,
   fewer on a phone), so 2rl = two rows' worth on any device.

   Properties (all optional, every section accepts them):
     display: row | group    rows scroll with the < > arrows,
                              groups wrap as a grid
     size:    14 | 2rl        poster count, plain number or in
                              row-length units
     title:   <text>          custom sections: the heading
     content: <ids>           custom sections: comma-separated
                              TMDB ids, like 1083381.movie or
                              66732.tv

   Section names: hero, continuewatching, recommended, featured,
   recent, top, database, backtotop. Any other block name is a
   custom section. An empty block means: all defaults.
   ============================================================= */

* {
    display: row;
}

hero {}

continuewatching {}

recommended {}

featured {}

recent {
    size: 2rl;
}

halloween {
    title: Halloween & Horror;
    content: 1339713.movie, 1083381.movie, 604079.movie, 507089.movie,
             66732.tv, 124364.tv, 694.movie, 948.movie, 419430.movie,
             4232.movie, 348.movie, 539.movie, 138843.movie, 377.movie;
}

top {
    size: 3rl;
    display: group;
}

database {}
