# Veridium home page layout (layout.conf)
# One section per line, top to bottom. Lines starting with #
# are comments. Unknown lines are ignored. Duplicate sections
# are shown only once.
#
# Section types:
#   super_featured     - the hero carousel at the top
#   continue_watching  - the continue watching row
#   recommended_row    - recommended picks, as a row
#   recent_row         - the 14 newest releases, as a row
#   recent_group       - the 14 newest releases, as a grid
#   featured_row       - every featured title in one scrolling row
#   featured_group     - every featured title as a grid
#   top{N}_group       - the N highest rated titles on TMDB,
#                        as a grid (top21_group, top50_group, ...)
#   database_button    - "Can't find something?" -> Search Database
#   backtotop          - "Couldn't find anything?" -> Back To Top
#   custom/{id}        - a custom section defined below
#
# Rows show posters in a horizontal strip with the two < > arrows,
# groups show every poster in a wrapping grid.

super_featured
continue_watching
recommended_row
featured_row
recent_row
custom/halloween
top21_group
database_button

# Custom sections. Each block is:
#   [custom/{id}]     - opens the definition (referenced above)
#   title:  heading shown above the posters
#   type:   row or group
#   content: comma-separated TMDB ids as {id}.movie or {id}.tv

[custom/halloween]
title: Halloween & Horror
type: row
content: 1339713.movie, 1083381.movie, 604079.movie, 507089.movie, 66732.tv, 124364.tv, 694.movie, 948.movie, 419430.movie, 4232.movie, 348.movie, 539.movie, 138843.movie, 377.movie
